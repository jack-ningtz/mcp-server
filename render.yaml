# Render Blueprint：一键部署「今日待办」云端 MCP 服务
# 用法：把 mcp-server 目录作为 Git 仓库根目录推送到 GitHub，
#      在 Render → New → Blueprint → 选择该仓库即可。
# 免费版足够跑通 OAuth 与工具调用；但实例休眠/重新部署会清空本地 JSON 数据。
# 正式长期使用请升级到带 Persistent Disk 的付费套餐，或把 store.js 换成云数据库。

services:
  - type: web
    name: daily-todo-mcp
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run start:http
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: PUBLIC_URL
        value: auto
      - key: OAUTH_STRICT
        value: "0"
